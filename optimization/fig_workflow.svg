<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" color="#1c1c1c" role="img" aria-label="Build workflow: assemble input series, run a forward solve with hand-set parameters through a sanity gate, then fit three rungs of increasing sophistication, feeding two validation suites for grid-matching and counterfactual behaviour.">
  <style>
    @media (prefers-color-scheme: dark) { svg { color: #e9e6e1 } .bg { fill: #141414 } }
    .bg { fill: #ffffff }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: currentColor }
    .t { font-size: 13px }
    .b { font-size: 11.5px }
    .s { font-size: 10.5px; opacity: .62 }
    .h { font-size: 11px; font-weight: 600; letter-spacing: .09em; opacity: .55 }
    .m { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity: .72 }
    .box { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .38; stroke-width: 1 }
    .ln { stroke: currentColor; stroke-opacity: .5; fill: none }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="660"/>

  <text class="h" x="24" y="26">BUILD WORKFLOW — each stage is a working model, not a milestone</text>

  <!-- back edge : gate fails -->
  <path class="ln" stroke-dasharray="5 4" d="M744 120 H786 V58 H124 V82" marker-end="url(#a)"/>
  <text class="s" x="455" y="52" text-anchor="middle">no  —  revise the anchors; do not start fitting</text>

  <!-- ROW 1 -->
  <rect class="box" x="24" y="88" width="200" height="64" rx="4"/>
  <text class="t" x="38" y="110">0 · input series</text>
  <text class="m" x="38" y="128">nd_free = nd − C</text>
  <text class="m" x="38" y="144">P̄, P_min, W̄, V̄, Cmin</text>

  <rect class="box" x="264" y="88" width="210" height="64" rx="4"/>
  <text class="t" x="278" y="110">1 · forward solve</text>
  <text class="s" x="278" y="128">θ hand-set from the measured</text>
  <text class="s" x="278" y="143">anchors — nothing fitted yet</text>

  <rect x="514" y="88" width="230" height="64" rx="4" fill="#e2603a" fill-opacity=".07" stroke="#e2603a" stroke-opacity=".6"/>
  <text class="h" x="528" y="108" fill="#e2603a" opacity="1">GATE  —  one day of work</text>
  <text class="s" x="528" y="126">sane merit order?</text>
  <text class="s" x="528" y="142">sane curtailment and price sign?</text>

  <path class="ln" d="M224 120 H258" marker-end="url(#a)"/>
  <path class="ln" d="M474 120 H508" marker-end="url(#a)"/>

  <!-- gate -> row 2 -->
  <path class="ln" d="M629 152 V196 H165 V226" marker-end="url(#a)"/>
  <text class="s" x="646" y="176">yes</text>

  <!-- ROW 2 -->
  <rect class="box" x="24" y="232" width="282" height="70" rx="4"/>
  <text class="t" x="38" y="254">2 · rung 1 — price as the dual</text>
  <text class="m" x="38" y="273">a + b·p = λ ≈ observed price</text>
  <text class="s" x="38" y="291">constrained least squares, closed form → θ₀</text>

  <rect class="box" x="340" y="232" width="282" height="70" rx="4"/>
  <text class="t" x="354" y="254">3 · rung 2 — decision loss</text>
  <text class="m" x="354" y="273">min ‖ p*(nd_free ; θ) − p_obs ‖²</text>
  <text class="s" x="354" y="291">differentiable λ-iteration; cvxpy as reference</text>

  <rect class="box" x="656" y="232" width="280" height="70" rx="4"/>
  <text class="t" x="670" y="254">4 · rung 3 — contextual bids</text>
  <text class="m" x="670" y="273">θ_t = f_φ(context_t)</text>
  <text class="s" x="670" y="291">end-to-end; closes the accuracy gap</text>

  <path class="ln" d="M306 267 H334" marker-end="url(#a)"/>
  <path class="ln" d="M622 267 H650" marker-end="url(#a)"/>

  <!-- fan into validation -->
  <path class="ln" d="M481 302 V346"/>
  <path class="ln" d="M796 302 V346"/>
  <path class="ln" d="M244 346 H796"/>
  <path class="ln" d="M244 346 V370" marker-end="url(#a)"/>
  <path class="ln" d="M716 346 V370" marker-end="url(#a)"/>

  <!-- ROW 3 : validation -->
  <rect class="box" x="24" y="376" width="440" height="236" rx="4"/>
  <text class="h" x="42" y="400">REQUIREMENT 1 — does it match the real grid</text>
  <g class="b">
    <text x="42" y="428">·  reconstruction MAE, 400 gaps   —  beat interp 50.6 MW</text>
    <text x="42" y="454" fill="#e2603a">◆  price λ vs the spot series   —  never fitted against</text>
    <text x="42" y="480" fill="#e2603a">◆  recovered a_i vs merit order   —  $11 → $171</text>
    <text x="42" y="506" fill="#e2603a">◆  negative price on 23.6% of steps, at the right times</text>
    <text x="42" y="532">·  curtailment: on/off F1 and level  —  beat 43.0 MW</text>
    <text x="42" y="558">·  activation share by net-demand decile</text>
    <text x="42" y="584">·  full test set, 186 days × 288 steps</text>
  </g>

  <rect class="box" x="496" y="376" width="440" height="236" rx="4"/>
  <text class="h" x="514" y="400">REQUIREMENT 2 — does the counterfactual hold up</text>
  <g class="b">
    <text x="514" y="428">·  feasibility exact — by construction, not by audit</text>
    <text x="514" y="454">·  response shares vs 44.1 / 22.4 / 6.5 / 2.4 / 13.0 / 11.5</text>
    <text x="514" y="480" fill="#e2603a">◆  timescale gradient 5 min → 3 h  (coal 15% → 34%)</text>
    <text x="514" y="506">·  raised-cosine demand — mix must shift with the slope</text>
    <text x="514" y="532">·  curtailment release  k = 0.42 / 0.33 / 0.24</text>
    <text x="514" y="558">·  an infeasible shift returns unserved MWh, not an error</text>
  </g>
  <text class="s" x="514" y="590">◆  emergent, not fitted — the strongest available result</text>

  <text class="s" x="24" y="632">Rungs 1–3 are cumulative: each one is a complete model, and the three together form the ablation table.</text>
  <text class="s" x="24" y="648">Stages 0–3 already answer both questions. Rung 3 is what closes the gap to the interpolation floor.</text>
</svg>
