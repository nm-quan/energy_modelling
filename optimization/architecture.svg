<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" color="#1c1c1c" role="img" aria-label="Inverse optimization for VIC dispatch: architecture and build order. Context feeds a bid network producing cost parameters into the solver objective; net demand feeds only the constraints. Build order runs from input series through a hand-set forward solve to three fitting rungs, then two validation suites.">
  <style>
    @media (prefers-color-scheme: dark) { svg { color: #e9e6e1 } .bg { fill: #141414 } }
    .bg { fill: #ffffff }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: currentColor }
    .t { font-size: 13px }
    .s { font-size: 11px; opacity: .62 }
    .h { font-size: 11px; font-weight: 600; letter-spacing: .1em; opacity: .55 }
    .m { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .box { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .35 }
    .ln { stroke: currentColor; stroke-opacity: .5; fill: none }
    .ac { fill: #e2603a }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2603a"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="710"/>

  <!-- ================= ARCHITECTURE ================= -->
  <text class="h" x="24" y="28">ARCHITECTURE</text>

  <rect class="box" x="24" y="60" width="190" height="52" rx="4"/>
  <text class="t" x="38" y="83">context</text>
  <text class="s" x="38" y="100">no demand · no price</text>

  <rect x="24" y="132" width="190" height="52" rx="4" fill="#e2603a" fill-opacity=".07" stroke="#e2603a" stroke-opacity=".55"/>
  <text class="m" x="38" y="155">nd_free = nd − C</text>
  <text class="s" x="38" y="172">net demand, exogenous</text>

  <rect class="box" x="24" y="204" width="190" height="52" rx="4"/>
  <text class="t" x="38" y="227">envelope</text>
  <text class="s" x="38" y="244">caps · ramps · SOC · must-run</text>

  <rect class="box" x="256" y="60" width="118" height="52" rx="4"/>
  <text class="t" x="315" y="83" text-anchor="middle">bid net</text>
  <text class="m" x="315" y="101" font-size="10" text-anchor="middle">θ = (a, b, g)</text>

  <rect x="418" y="52" width="250" height="248" rx="8" fill="#e2603a" fill-opacity=".05" stroke="#e2603a" stroke-opacity=".5"/>
  <text class="h ac" x="543" y="76" text-anchor="middle" opacity="1">ARGMIN  over  p, C, u</text>

  <rect class="box" x="436" y="90" width="214" height="72" rx="4"/>
  <text class="h" x="448" y="108">OBJECTIVE</text>
  <text class="m" x="448" y="130">Σ a·p + ½ b·p²</text>
  <text class="m" x="448" y="150">+ g·c + VOLL·u</text>

  <rect class="box" x="436" y="182" width="214" height="98" rx="4"/>
  <text class="h" x="448" y="200">CONSTRAINTS</text>
  <text class="m ac" x="448" y="222">Σ s·p + u = nd_free + C</text>
  <text class="m" x="448" y="242">0 ≤ p ≤ P̄,  P_min</text>
  <text class="m" x="448" y="262">ramp, SOC, spill</text>

  <path class="ln" d="M214 86 H250" marker-end="url(#a)"/>
  <path class="ln" d="M374 86 C 400 86, 404 106, 430 116" marker-end="url(#a)"/>
  <text class="m" x="399" y="82" text-anchor="middle">θ</text>

  <!-- forbidden -->
  <path d="M214 144 C 280 132, 350 122, 428 120" stroke="#e2603a" stroke-opacity=".4" stroke-dasharray="4 4" fill="none"/>
  <circle cx="268" cy="135" r="9" fill="#e2603a" fill-opacity=".14" stroke="#e2603a" stroke-opacity=".7"/>
  <path d="M263.5 130.5 L272.5 139.5 M272.5 130.5 L263.5 139.5" stroke="#e2603a" stroke-width="1.5"/>
  <text class="s ac" x="284" y="131" opacity="1">never</text>

  <!-- allowed -->
  <path d="M214 168 C 290 186, 360 202, 428 210" stroke="#e2603a" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <text class="s ac" x="412" y="186" text-anchor="end" opacity="1">demand enters here only</text>

  <path class="ln" d="M214 236 H428" marker-end="url(#a)"/>

  <rect class="box" x="712" y="62" width="164" height="40" rx="4"/>
  <text class="t" x="794" y="87" text-anchor="middle">dispatch  p  (6 ch)</text>
  <rect class="box" x="712" y="116" width="164" height="40" rx="4"/>
  <text class="t" x="794" y="141" text-anchor="middle">curtailment  C</text>
  <rect class="box" x="712" y="170" width="164" height="40" rx="4"/>
  <text class="t" x="794" y="195" text-anchor="middle">unserved  u</text>
  <rect class="box" x="712" y="224" width="164" height="48" rx="4"/>
  <text class="t" x="794" y="246" text-anchor="middle">price  λ</text>
  <text class="s" x="794" y="263" text-anchor="middle">dual of the balance row</text>

  <path class="ln" d="M668 82 H706" marker-end="url(#a)"/>
  <path class="ln" d="M668 136 H706" marker-end="url(#a)"/>
  <path class="ln" d="M668 190 H706" marker-end="url(#a)"/>
  <path class="ln" d="M668 248 H706" marker-end="url(#a)"/>

  <path class="ln" stroke-dasharray="5 4" d="M794 62 V 34 H 315 V 54" marker-end="url(#a)"/>
  <text class="s" x="560" y="28" text-anchor="middle">decision loss  ‖ p* − p_obs ‖²  updates θ</text>

  <path d="M24 352 H876" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 4"/>

  <!-- ================= BUILD ORDER ================= -->
  <text class="h" x="24" y="388">BUILD ORDER</text>

  <rect class="box" x="24" y="412" width="152" height="64" rx="4"/>
  <text class="t" x="38" y="436">0 · inputs</text>
  <text class="s" x="38" y="456">nd_free, bounds</text>

  <rect x="199" y="412" width="152" height="64" rx="4" fill="#e2603a" fill-opacity=".07" stroke="#e2603a" stroke-opacity=".55"/>
  <text class="t" x="213" y="436">1 · forward solve</text>
  <text class="s" x="213" y="456">θ set by hand</text>

  <rect class="box" x="374" y="412" width="152" height="64" rx="4"/>
  <text class="t" x="388" y="436">2 · rung 1</text>
  <text class="s" x="388" y="456">price = the dual</text>

  <rect class="box" x="549" y="412" width="152" height="64" rx="4"/>
  <text class="t" x="563" y="436">3 · rung 2</text>
  <text class="s" x="563" y="456">decision loss</text>

  <rect class="box" x="724" y="412" width="152" height="64" rx="4"/>
  <text class="t" x="738" y="436">4 · rung 3</text>
  <text class="s" x="738" y="456">learned bids</text>

  <path class="ln" d="M176 444 H193" marker-end="url(#a)"/>
  <path class="ln" d="M351 444 H368" marker-end="url(#a)"/>
  <path class="ln" d="M526 444 H543" marker-end="url(#a)"/>
  <path class="ln" d="M701 444 H718" marker-end="url(#a)"/>

  <text class="s ac" x="275" y="496" text-anchor="middle" opacity="1">gate: sane merit order and curtailment before any fitting</text>

  <path class="ln" d="M625 476 V512"/>
  <path class="ln" d="M800 476 V512"/>
  <path class="ln" d="M231 512 H800"/>
  <path class="ln" d="M231 512 V536" marker-end="url(#a)"/>
  <path class="ln" d="M669 512 V536" marker-end="url(#a)"/>

  <rect class="box" x="24" y="542" width="414" height="130" rx="4"/>
  <text class="h" x="42" y="566">REQ 1 — matches the real grid</text>
  <g class="t">
    <text x="42" y="594">MAE on 400 gaps  —  beat interp 50.6 MW</text>
    <text class="ac" x="42" y="618">λ vs the spot price  —  never fitted</text>
    <text class="ac" x="42" y="642">merit order  $11 → $171</text>
    <text class="ac" x="42" y="666">negative price on 23.6% of steps</text>
  </g>

  <rect class="box" x="462" y="542" width="414" height="130" rx="4"/>
  <text class="h" x="480" y="566">REQ 2 — counterfactual holds up</text>
  <g class="t">
    <text x="480" y="594">feasible by construction, not by audit</text>
    <text x="480" y="618">shares vs 44.1 / 22.4 / 6.5 / 2.4 / 13.0 / 11.5</text>
    <text class="ac" x="480" y="642">timescale gradient 5 min → 3 h</text>
    <text x="480" y="666">infeasible shift → unserved MWh</text>
  </g>

  <text class="s ac" x="24" y="698" opacity="1">orange = not fitted; the model predicts it, so it is a real test</text>
</svg>
