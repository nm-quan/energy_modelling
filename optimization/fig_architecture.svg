<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" color="#1c1c1c" role="img" aria-label="Architecture of the inverse-optimization dispatch model: context features feed a bid network producing cost parameters into the solver objective, while net demand and the constraint envelope feed only the solver constraints, never the objective.">
  <style>
    @media (prefers-color-scheme: dark) { svg { color: #e9e6e1 } .bg { fill: #141414 } }
    .bg { fill: #ffffff }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: currentColor }
    .t { font-size: 13px }
    .s { font-size: 10.5px; opacity: .62 }
    .h { font-size: 11px; font-weight: 600; letter-spacing: .09em; opacity: .55 }
    .m { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .box { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .38; stroke-width: 1 }
    .ln { stroke: currentColor; stroke-opacity: .5; fill: none }
    .acc { color: #e2603a }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" fill-opacity=".55"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2603a"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="580"/>

  <!-- ============ LANE A : what it replaces ============ -->
  <g opacity=".5">
    <text class="h" x="24" y="30">REPLACED — planB: predict, then repair</text>
    <rect class="box" x="24"  y="46" width="132" height="44" rx="4"/>
    <text class="t" x="90"  y="73" text-anchor="middle">features + nd</text>
    <rect class="box" x="192" y="46" width="120" height="44" rx="4"/>
    <text class="t" x="252" y="73" text-anchor="middle">network</text>
    <rect class="box" x="348" y="46" width="132" height="44" rx="4"/>
    <text class="t" x="414" y="73" text-anchor="middle">raw dispatch</text>
    <rect class="box" x="516" y="46" width="140" height="44" rx="4"/>
    <text class="t" x="586" y="73" text-anchor="middle">projection head</text>
    <rect class="box" x="692" y="46" width="120" height="44" rx="4"/>
    <text class="t" x="752" y="73" text-anchor="middle">dispatch</text>
    <path class="ln" d="M156 68 H186" marker-end="url(#a)"/>
    <path class="ln" d="M312 68 H342" marker-end="url(#a)"/>
    <path class="ln" d="M480 68 H510" marker-end="url(#a)"/>
    <path class="ln" d="M656 68 H686" marker-end="url(#a)"/>
    <text class="s" x="586" y="106" text-anchor="middle">the head ends up choosing the allocation  (P2)</text>
  </g>
  <path d="M24 128 H936" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 4"/>

  <!-- ============ LANE B : the model ============ -->
  <text class="h" x="24" y="158">INVERSE OPTIMIZATION — learn the bids, let the optimizer dispatch</text>

  <!-- inputs -->
  <rect class="box" x="24" y="174" width="210" height="72" rx="4"/>
  <text class="t" x="38" y="196">context</text>
  <text class="s" x="38" y="213">calendar · plant availability</text>
  <text class="s" x="38" y="228">renewables · recent bid state</text>
  <text class="s" x="38" y="240" fill="#e2603a" opacity="1">no demand · no price</text>

  <rect class="box" x="24" y="272" width="210" height="46" rx="4"/>
  <text class="m" x="129" y="292" text-anchor="middle">nd_free = nd − C</text>
  <text class="s" x="129" y="308" text-anchor="middle">exogenous net demand</text>

  <rect class="box" x="24" y="344" width="210" height="72" rx="4"/>
  <text class="t" x="38" y="366">envelope</text>
  <text class="s" x="38" y="383">P̄, P_min · ramps · SOC</text>
  <text class="s" x="38" y="398">W̄, V̄ · Cmin</text>
  <text class="s" x="38" y="411">time-varying, from commitment</text>

  <!-- bid net -->
  <rect class="box" x="266" y="182" width="132" height="62" rx="4"/>
  <text class="t" x="332" y="202" text-anchor="middle">bid net  f<tspan font-size="9" dy="3">φ</tspan></text>
  <text class="s" x="332" y="219" text-anchor="middle">rungs 2–3</text>
  <text class="m" x="332" y="236" font-size="10" text-anchor="middle">θ = (a, b, g)</text>
  <path class="ln" d="M234 210 H260" marker-end="url(#a)"/>

  <!-- solver -->
  <rect x="464" y="172" width="278" height="266" rx="8" fill="#e2603a" fill-opacity=".05" stroke="#e2603a" stroke-opacity=".55"/>
  <text class="h" x="603" y="194" text-anchor="middle" fill="#e2603a" opacity="1">ARGMIN   over  p, C, u</text>

  <rect class="box" x="482" y="206" width="242" height="80" rx="4"/>
  <text class="h" x="494" y="224">OBJECTIVE</text>
  <text class="m" x="494" y="245">Σ a·p + ½ b·p²</text>
  <text class="m" x="494" y="262">+ g_w·c_w + g_v·c_v</text>
  <text class="m" x="494" y="279">+ VOLL·u</text>

  <rect class="box" x="482" y="306" width="242" height="112" rx="4"/>
  <text class="h" x="494" y="324">CONSTRAINTS</text>
  <text class="m" x="494" y="346" fill="#e2603a">Σ s·p + u = nd_free + C</text>
  <text class="m" x="494" y="366">P_min ≤ p ≤ P̄</text>
  <text class="m" x="494" y="386">|Δp| ≤ ramp,  SOC</text>
  <text class="m" x="494" y="406">Cmin ≤ C ≤ W̄ + V̄</text>

  <!-- theta arrow -->
  <path class="ln" d="M398 210 C 432 210, 440 232, 476 240" marker-end="url(#a)"/>
  <text class="m" x="429" y="204" text-anchor="middle">θ</text>

  <!-- FORBIDDEN path : nd_free -> objective -->
  <path d="M234 282 C 320 268, 380 258, 470 252" stroke="#e2603a" stroke-opacity=".45" stroke-dasharray="4 4" fill="none"/>
  <circle cx="352" cy="266" r="10" fill="#e2603a" fill-opacity=".14" stroke="#e2603a" stroke-opacity=".7"/>
  <path d="M347 261 L357 271 M357 261 L347 271" stroke="#e2603a" stroke-width="1.6"/>
  <text class="s" x="368" y="262" fill="#e2603a" opacity="1">never</text>

  <!-- ALLOWED path : nd_free -> constraints -->
  <path d="M234 306 C 330 322, 392 336, 470 342" stroke="#e2603a" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <text class="s" x="322" y="330" text-anchor="end" fill="#e2603a" opacity="1">demand enters here only</text>

  <path class="ln" d="M234 380 H470" marker-end="url(#a)"/>

  <!-- outputs -->
  <rect class="box" x="786" y="186" width="150" height="40" rx="4"/>
  <text class="t" x="861" y="211" text-anchor="middle">dispatch  p  (6 ch)</text>
  <rect class="box" x="786" y="240" width="150" height="40" rx="4"/>
  <text class="t" x="861" y="265" text-anchor="middle">curtailment  C</text>
  <rect class="box" x="786" y="294" width="150" height="40" rx="4"/>
  <text class="t" x="861" y="319" text-anchor="middle">unserved  u</text>
  <rect class="box" x="786" y="348" width="150" height="52" rx="4"/>
  <text class="t" x="861" y="371" text-anchor="middle">price  λ</text>
  <text class="s" x="861" y="388" text-anchor="middle">dual of the balance row</text>

  <path class="ln" d="M742 206 H780" marker-end="url(#a)"/>
  <path class="ln" d="M742 260 H780" marker-end="url(#a)"/>
  <path class="ln" d="M742 314 H780" marker-end="url(#a)"/>
  <path class="ln" d="M742 374 H780" marker-end="url(#a)"/>

  <!-- feedback -->
  <path class="ln" stroke-dasharray="5 4" d="M861 400 V 470 H 332 V 244" marker-end="url(#a)"/>
  <text class="s" x="600" y="462" text-anchor="middle">decision loss   ‖ p*(nd_free ; θ) − p_obs ‖²   updates θ</text>

  <text class="s" x="24" y="512">λ is never fitted. It falls out of the solved problem, so comparing it to the observed spot price is an out-of-sample test of the mechanism.</text>
  <text class="s" x="24" y="530">Feasibility is not checked after the fact: every output is feasible because the envelope is a constraint of the argmin, not a repair applied to it.</text>
  <text class="s" x="24" y="548">Demand touches only the constraint row, so the recovered bids stay invariant under a demand shift. That is what licenses the counterfactual.</text>
</svg>
