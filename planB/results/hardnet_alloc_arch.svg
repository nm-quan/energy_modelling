<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1a1a1a; }
    .t   { font-size: 13px; text-anchor: middle; }
    .tb  { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .ts  { font-size: 11px; fill: #555; text-anchor: middle; }
    .tm  { font-size: 12.5px; font-family: "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
    .side{ font-size: 13px; }
    .ttl { font-size: 15px; font-weight: 700; }
    .box { stroke-width: 1.3; rx: 7; }
    .arw { stroke: #1a1a1a; stroke-width: 1.7; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="880" fill="#f5f5f5"/>
  <text class="ttl" x="24" y="30">hardnet_alloc — architecture and data flow</text>

  <!-- ===== input ===== -->
  <rect class="box" x="300" y="52" width="320" height="54" fill="#FDF3D1" stroke="#B0A052"/>
  <text class="tb" x="460" y="74">Input window</text>
  <text class="tm" x="460" y="94">(B, 132, 21) + mask</text>
  <text class="ts" x="460" y="122">48 ctx | 36 gap | 48 ctx — dispatch &amp; curtailment zeroed in the gap</text>
  <path class="arw" d="M460,130 L460,150" marker-end="url(#ah)"/>

  <!-- ===== network ===== -->
  <rect class="box" x="230" y="152" width="530" height="60" fill="#F7D9EE" stroke="#B07FA0"/>
  <text class="tb" x="495" y="177">Network  (BiLSTM)</text>
  <text class="ts" x="495" y="197">2 × 192 bidirectional · 1.22 M parameters · the only learned block</text>

  <!-- fan-out -->
  <path class="arw" d="M495,212 L495,232 M95,232 L660,232 M95,232 L95,250 M430,232 L430,250 M660,232 L660,250"/>
  <path class="arw" d="M95,244 L95,254"  marker-end="url(#ah)"/>
  <path class="arw" d="M430,244 L430,254" marker-end="url(#ah)"/>
  <path class="arw" d="M660,244 L660,254" marker-end="url(#ah)"/>

  <!-- ===== three heads ===== -->
  <rect class="box" x="20"  y="256" width="150" height="46" fill="#fff" stroke="#555"/>
  <text class="t"  x="95"  y="275">Curtailment</text>
  <text class="tm" x="95"  y="293">(B, 36, 2)</text>

  <rect class="box" x="345" y="256" width="170" height="46" fill="#fff" stroke="#555"/>
  <text class="t"  x="430" y="275">Dispatch residual</text>
  <text class="tm" x="430" y="293">(B, 36, 6)</text>

  <rect class="box" x="560" y="256" width="200" height="46" fill="#fff" stroke="#555"/>
  <text class="t"  x="660" y="275">Allocation logits</text>
  <text class="tm" x="660" y="293">(B, 36, 6)</text>

  <!-- ===== left lane: curtailment ===== -->
  <path class="arw" d="M95,302 L95,326" marker-end="url(#ah)"/>
  <rect class="box" x="20" y="328" width="150" height="38" fill="#FFF0CF" stroke="#B0A052"/>
  <text class="t" x="95" y="352">ReLU  (z-space)</text>
  <path class="arw" d="M95,366 L95,780" marker-end="url(#ah)"/>
  <text class="ts" x="95" y="392">no head,</text>
  <text class="ts" x="95" y="406">no skeleton</text>

  <!-- ===== middle lane: dispatch + interpolation ===== -->
  <path class="arw" d="M430,302 L430,330" marker-end="url(#ah)"/>
  <circle cx="430" cy="348" r="15" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M420,348 L440,348 M430,338 L430,358" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect class="box" x="185" y="322" width="155" height="52" fill="#FDE3C7" stroke="#BE8A4E"/>
  <text class="t"  x="262" y="342">Interpolation</text>
  <text class="ts" x="262" y="359">straight line pL → pR</text>
  <path class="arw" d="M340,348 L410,348" marker-end="url(#ah)"/>
  <text class="ts" x="262" y="390">fixed prior, not learned</text>
  <text class="ts" x="262" y="404">and NOT part of the head</text>
  <text class="ts" x="262" y="418">(--no-residual turns it off)</text>

  <path class="arw" d="M430,363 L430,392" marker-end="url(#ah)"/>
  <rect class="box" x="345" y="394" width="170" height="46" fill="#fff" stroke="#555"/>
  <text class="tb" x="430" y="413">F — raw dispatch</text>
  <text class="tm" x="430" y="431">(B, 36, 6) MW</text>

  <!-- ===== right lane: allocation ===== -->
  <path class="arw" d="M660,302 L660,326" marker-end="url(#ah)"/>
  <rect class="box" x="560" y="328" width="200" height="38" fill="#E4DCF8" stroke="#8B7BC0"/>
  <text class="t" x="660" y="352">Softmax</text>
  <path class="arw" d="M660,366 L660,392" marker-end="url(#ah)"/>
  <rect class="box" x="560" y="394" width="200" height="46" fill="#fff" stroke="#555"/>
  <text class="tb" x="660" y="413">p — allocation shares</text>
  <text class="tm" x="660" y="431">w = 1 / p</text>

  <path class="arw" d="M430,440 L430,478" marker-end="url(#ah)"/>
  <path class="arw" d="M660,440 L660,478" marker-end="url(#ah)"/>

  <!-- ===== constraint head container ===== -->
  <rect class="box" x="320" y="480" width="470" height="182" fill="#E9F4E1" stroke="#88B070"/>
  <text class="side" x="800" y="562" font-weight="700">Projection</text>
  <text class="side" x="800" y="580" font-weight="700">head</text>
  <text class="ts"   x="828" y="600">36-step sweep</text>

  <rect class="box" x="342" y="500" width="426" height="60" fill="#D5E9F7" stroke="#6C9CC0"/>
  <text class="tb" x="555" y="521">Feasible box</text>
  <text class="tm" x="555" y="543">lo, hi ← [0, cap] ∧ P₋₁ ± ramp ∧ still reach pR</text>

  <path class="arw" d="M555,560 L555,582" marker-end="url(#ah)"/>

  <rect class="box" x="342" y="584" width="426" height="60" fill="#D5E9F7" stroke="#6C9CC0"/>
  <text class="tb" x="555" y="605">Weighted projection</text>
  <text class="tm" x="555" y="627">P = clip( F + λ · s / w , lo, hi ),   s · P = nd</text>

  <path class="arw" d="M555,662 L555,694" marker-end="url(#ah)"/>

  <!-- ===== output ===== -->
  <rect class="box" x="342" y="696" width="426" height="50" fill="#E4DCF8" stroke="#8B7BC0"/>
  <text class="tb" x="555" y="716">Output P   (B, 36, 6) MW</text>
  <text class="ts" x="555" y="736">balance · floor · cap · ramps · both seams exact, for any p</text>

  <path class="arw" d="M555,746 L555,780" marker-end="url(#ah)"/>

  <!-- ===== loss ===== -->
  <rect class="box" x="20" y="782" width="860" height="62" fill="#fff" stroke="#555"/>
  <text class="tb" x="450" y="806">Loss</text>
  <text class="tm" x="450" y="826">MSE over 8 z-scored channels   +   α · CE( p , s·a )</text>
  <text class="ts" x="450" y="860">a = measured marginal response, local OLS on ±3 h of history · α = 1 for alloc_sup, 0 for alloc_unsup</text>
</svg>
